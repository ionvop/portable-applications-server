<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Play button</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="472" y2="472">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="shape">
      <polygon points="175,110 175,402 425,256"/>
    </g>
  </defs>

  <!-- soft glow -->
  <use href="#shape" fill="url(#g)" stroke="url(#g)" stroke-width="84" stroke-linejoin="round" filter="url(#glow)" opacity="0.95"/>
  <!-- crisp gradient rim (keeps the shape readable at 32px) -->
  <use href="#shape" fill="url(#g)" stroke="url(#g)" stroke-width="64" stroke-linejoin="round"/>
  <!-- black glyph, rounded corners -->
  <use href="#shape" fill="#000" stroke="#000" stroke-width="40" stroke-linejoin="round"/>
</svg>
