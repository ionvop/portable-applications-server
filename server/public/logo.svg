<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Cat-eared headphones</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="472" y2="472">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="shape" transform="translate(0 -9)">
      <!-- headband -->
      <path d="M100 320 A156 170 0 0 1 412 320 L372 320 A116 130 0 0 0 140 320 Z"/>
      <!-- cat ears -->
      <polygon points="118,250 124,92 246,172 246,205"/>
      <polygon points="394,250 388,92 266,172 266,205"/>
      <!-- ear cups -->
      <rect x="84" y="300" width="80" height="140" rx="30"/>
      <rect x="348" y="300" width="80" height="140" rx="30"/>
    </g>
  </defs>

  <!-- soft glow -->
  <use href="#shape" fill="url(#g)" stroke="url(#g)" stroke-width="40" stroke-linejoin="round" filter="url(#glow)" opacity="0.95"/>
  <!-- crisp gradient rim (keeps the shape readable at 32px) -->
  <use href="#shape" fill="url(#g)" stroke="url(#g)" stroke-width="30" stroke-linejoin="round"/>
  <!-- black glyph, rounded corners -->
  <use href="#shape" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
</svg>
