name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install backend dependencies
        # Only what the API and the smoke suite import. pywebview and
        # pyinstaller need a desktop environment and are not exercised here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        # The smoke suite's SPA checks read dist/index.html.
        run: npm run build

      - name: Run smoke suite
        run: python -m pytest

      - name: Lint frontend
        run: npm run lint
